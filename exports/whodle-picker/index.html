<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whodle question picker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b24;color:#f5f2e8;font:16px system-ui}main{max-width:1100px;margin:40px auto;padding:0 24px}h1{margin-bottom:8px}p,.muted{color:#abb8c0}form,.card{background:#192934;border:1px solid #354b59;border-radius:14px;padding:24px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}label{display:grid;gap:8px}input,select,button{font:inherit;border-radius:8px;padding:12px;border:1px solid #516777;background:#101b24;color:inherit;min-width:0}button{cursor:pointer;background:#f5c368;color:#172630;font-weight:650}button.secondary{background:#263e4d;color:#f5f2e8}button:disabled{opacity:.45;cursor:wait}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{flex:1}small{color:#abb8c0}#members{width:100%;margin-top:10px}details{margin:20px 0}summary{cursor:pointer}#channels{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}#channels label{display:flex;align-items:center}#status{white-space:pre-line;line-height:1.6}#results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{margin:0;overflow-wrap:anywhere}.card img{max-width:100%;max-height:320px;display:block;margin:12px auto;border-radius:8px}.quote{white-space:pre-wrap;line-height:1.65}.card a{color:#f5c368}h2{font-size:20px}#download{margin:20px 0} @media(max-width:700px){.grid,#results{grid-template-columns:1fr}}
</style><main><h1>Whodle question picker</h1><p id="connection">Connecting to your Discord bot…</p><form id="form">
<label>Find a Discord member<div class="row"><input id="lookup" placeholder="Username, nickname, or Discord user ID"><button type="button" id="find" class="secondary">Find user</button></div></label><select id="members" aria-label="Matching members"><option value="">Choose a member after searching</option></select>
<div class="grid" style="margin-top:20px"><label>Start date (UTC, inclusive)<input id="start" type="date" required></label><label>End date (UTC, inclusive)<input id="end" type="date" required></label><label>Question type<select id="mode"><option value="quote">Who said it? — text quote</option><option value="post">Who posted it? — image post</option></select></label><label>Minimum message length<div class="row"><input id="minimum" type="number" min="0" max="4000" value="10" required><select id="unit" aria-label="Length unit"><option value="characters">Characters</option><option value="words">Words</option></select></div><small>For image-only posts, use 0. Otherwise this filters the caption.</small></label></div>
<details><summary>Channels and scan limit</summary><p>Searches configured text channels only; excludes threads. Leave all unchecked to search all listed channels.</p><div id="channels"></div><label style="margin-top:20px">Maximum messages to scan<input id="limit" type="number" min="100" max="100000" value="20000" required></label><small>Counts messages from all authors. Narrow channels or dates for a faster search.</small></details>
<div class="row"><button id="search">Find all matches</button><button type="button" id="cancel" class="secondary" disabled>Cancel</button></div></form><p id="status" role="status" aria-live="polite"></p><button id="download" hidden>Download results JSON</button><section id="results"></section></main>
<script>
const $=id=>document.getElementById(id);let job=null,results=[],filters={};
const today=new Date();$('end').value=today.toISOString().slice(0,10);today.setFullYear(today.getFullYear()-1);$('start').value=today.toISOString().slice(0,10);
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await r.json();if(!r.ok||data.error)throw Error(data.error||'Request failed');return data}
function error(e){$('status').textContent=e.message}
api('/api/info').then(info=>{$('connection').textContent=info.guild+' · Connected as '+info.bot;for(const c of info.channels){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=c.id;label.append(input,document.createTextNode('#'+c.name));$('channels').append(label)}}).catch(error);
$('find').onclick=async()=>{try{$('find').disabled=true;const members=await api('/api/users?q='+encodeURIComponent($('lookup').value));$('members').replaceChildren();for(const m of members){const o=document.createElement('option');o.value=m.id;o.textContent=m.name+' (@'+m.username+')';$('members').append(o)}$('status').textContent=members.length?'Choose the matching member, then search.':'No member found. Try their numeric Discord user ID.'}catch(e){error(e)}finally{$('find').disabled=false}};
function render(items){results=items;$('download').hidden=!items.length;$('results').replaceChildren();items.forEach((r,i)=>{const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=(i+1)+'. '+r.answer;const p=document.createElement('p');p.className='quote';p.textContent=r.text||'(Image-only post)';card.append(h,p);for(const url of r.images){const img=document.createElement('img');img.src=url;img.alt='Discord image post';img.loading='lazy';img.referrerPolicy='no-referrer';card.append(img)}const meta=document.createElement('p');meta.textContent='#'+r.channel+' · '+new Date(r.timestamp).toLocaleString();const link=document.createElement('a');link.href=r.discordUrl;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open original message';card.append(meta,link);$('results').append(card)})}
function busy(value){$('search').disabled=value;$('cancel').disabled=!value;$('find').disabled=value}
async function poll(){try{const state=await api('/api/job?id='+job);$('status').textContent=state.status+' · '+state.scanned+' messages scanned · '+state.matched+' matching messages'+(state.channel?' · #'+state.channel:'');if(state.status==='running'){setTimeout(poll,1000);return}render(state.results||[]);if(state.warnings?.length)$('status').textContent+='\n'+state.warnings.join('\n');if(state.savedFile)$('status').textContent+='\nSaved to: '+state.savedFile;busy(false);job=null}catch(e){error(e);busy(false)}}
$('form').onsubmit=async e=>{e.preventDefault();if(!$('members').value){error(Error('Find and select a Discord member first.'));return}try{filters={user:$('members').value,start:$('start').value,end:$('end').value,mode:$('mode').value,minimum:Number($('minimum').value),unit:$('unit').value,limit:Number($('limit').value),channels:[...$('channels').querySelectorAll('input:checked')].map(x=>x.value)};busy(true);render([]);$('status').textContent='Starting search…';job=(await api('/api/search',filters)).id;poll()}catch(e){error(e);busy(false)}};
$('cancel').onclick=async()=>{try{await api('/api/cancel',{id:job});$('cancel').disabled=true;$('status').textContent='Cancelling after the current Discord request…'}catch(e){error(e)}};
$('download').onclick=()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),filters,results},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='whodle-'+filters.mode+'-questions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
